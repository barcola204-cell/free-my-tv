name: Build Free My TV APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Get source code
    uses: actions/checkout@v4
  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
  - name: Install Android SDK components
    run: |
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34"
  - name: Configure TMDB key
    env:
      TMDB_KEY: ${{ secrets.TMDB_KEY }}
    run: |
      python3 - <<'PY'
      import os
      from pathlib import Path
      source = Path("config.example.properties")
      config = Path("config.properties")
      if not source.exists():
          raise SystemExit("config.example.properties not found")
      lines = source.read_text().splitlines()
      found = False
      for i, line in enumerate(lines):
          if line.strip().startswith("tmdb_key="):
              lines[i] = "tmdb_key=" + os.environ["TMDB_KEY"]
              found = True
      if not found:
          lines.append("tmdb_key=" + os.environ["TMDB_KEY"])
      config.write_text("\n".join(lines) + "\n")
      PY
  - name: Build APK
    run: ./build.sh
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FreeMyTV-APK
      path: FreeMyTV.apk
      if-no-files-found: error
  - name: Upload Built Artifact
    uses: actions/upload-artifact@v4
    with:
          name: app-build
          path: |
            **/*.apk
            **/*.zip
            build/
